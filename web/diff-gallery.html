<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gh-dash · diff gallery (dev only)</title>
    <style>
      html, body, #root { height: 100%; }
      body { background: var(--page); }
      .gal { display: flex; flex-direction: column; height: 100%; }
      .gal-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--page); border-bottom: 1px solid var(--border-strong); font-size: 12px; color: var(--muted); }
      .gal-bar select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; height: 26px; padding: 0 6px; }
      .gal-bar label { display: inline-flex; align-items: center; gap: 5px; }
      /* Stand-in for the shell (web/src/components/DiffView.tsx): its header and body rules, copied
         from web.css on the diff-view branch. */
      .diff-view { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
      .dv-head { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 14px 8px 22px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
      .dv-head .repo-chip { flex: none; }
      .dv-title { flex: 0 1 auto; min-width: 0; margin: 0 4px; font-size: 14.5px; font-weight: 600; line-height: 1.35; letter-spacing: -.005em; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dv-head .diffstat, .dv-files { flex: none; white-space: nowrap; }
      .dv-files { font-size: 12.5px; color: var(--muted); }
      .dv-actions { display: flex; align-items: center; gap: 4px; flex: none; margin-left: auto; padding-left: 8px; }
      .dv-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
      .dv-body:focus { outline: none; }
      @media (max-width: 900px) {
        .dv-head { flex-wrap: wrap; row-gap: 2px; padding: 4px 8px 10px 16px; }
        .dv-title { order: 1; flex: 1 0 100%; margin: 0; white-space: normal; overflow-wrap: anywhere; }
        .dv-head .diffstat, .dv-files { order: 2; }
        .dv-actions .btn { min-width: 40px; min-height: 40px; justify-content: center; }
        .dv-lbl { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/diff/gallery.tsx"></script>
  </body>
</html>
