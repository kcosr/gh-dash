<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gh-dash · chart gallery (dev only)</title>
    <style>
      body { background: var(--wb-page); }
      .gal-sec { background: var(--wb-page); color: var(--wb-fg); padding: 6px 0 20px; }
      .gal-sec + .gal-sec { border-top: 1px solid var(--wb-border-strong); }
      .gal-h { margin: 0; padding: 18px 24px 0; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--wb-muted); }
      .gal-sub { margin: 18px 24px 0; font-size: 12px; font-weight: 600; color: var(--wb-fg-2); }
      .gal-box { margin: 10px 24px 0; background: var(--wb-surface); border: 1px solid var(--wb-border); border-radius: 12px; padding: 12px 16px 10px; }
      .gal-box .cap { font-size: 12.5px; color: var(--wb-muted); margin-bottom: 4px; }
      .gal-repos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 14px 24px 0; }
      .gal-row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
      .gal-row .it { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--wb-muted); }
      .charts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 0; }
      .charts.narrow { grid-template-columns: 340px minmax(0, 1fr); padding-bottom: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/charts/gallery.tsx"></script>
  </body>
</html>
